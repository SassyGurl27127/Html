<html>
    <head>
        <style>
            img#catRight{
                float: right;
            }
             img#catLeft{
                float: left;
            }

        </style>
    </head>
    <body>

        <h2>Float Right</h2>

        <p>In this example, the image wil float to the right in the paragraph,
     and the text in the paragrph wil wrap around  the image </p>
     
     <p>

       <img id="catRight" src="Cat.jpeg" alt="Cat Error"
        style="width: 100px;height: 100px;">
       <img id="catLeft" src="Cat.jpeg" alt="Cat Error"
        style="width: 100px;height: 100px;">
     </p>
    </body>
</html>
