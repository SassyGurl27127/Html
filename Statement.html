<html>
    <body>
        <h2>JavaScript Statements</h2>
        <P>A<b>JavaScript script program</b> is a list of
        <b>statements</b> to be executed by a computer.</P>

        <p id="demo"></p>

        <script>
            var x,y,z; //Statement1
              var x = 5; //Statement2
                var y = 6; //Statement3
                  var z = x + y; //Statement4

                  document.getElementById("demo").innerHTML = 
                "The value of z is" + z + ".";

        </script>
        
    </body>
</html>
